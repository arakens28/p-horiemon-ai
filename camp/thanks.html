<title>お申込みありがとうございます | ホリエモンAI学校 1日Camp</title>
<link rel="icon" href="/camp/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --orange: #d97706;
  --orange-dark: #b45309;
  --orange-bg: #fef3c7;
  --orange-soft: #fffbeb;
  --text: #1f2937;
  --text-soft: #4b5563;
  --muted: #9ca3af;
  --line-color: #e5e7eb;
  --bg-alt: #f9fafb;
  --radius: 14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP','Inter',sans-serif;color:var(--text);background:var(--bg-alt);line-height:1.8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px;}
.logo{height:40px;margin-bottom:28px;}
.card{background:#fff;border:1px solid var(--line-color);border-radius:var(--radius);max-width:560px;width:100%;padding:40px 28px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.04);}
.check{width:64px;height:64px;border-radius:50%;background:var(--orange-bg);color:var(--orange-dark);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;margin:0 auto 20px;}
h1{font-size:1.45rem;font-weight:900;line-height:1.5;margin-bottom:12px;}
.lead{color:var(--text-soft);font-size:.95rem;margin-bottom:28px;}
.steps{text-align:left;background:var(--orange-soft);border:1px solid var(--orange-bg);border-radius:12px;padding:20px 22px;margin-bottom:24px;}
.steps h2{font-size:.95rem;font-weight:900;color:var(--orange-dark);margin-bottom:10px;}
.steps ol{padding-left:1.3em;font-size:.9rem;}
.steps li{margin-bottom:6px;}
.note{font-size:.8rem;color:var(--muted);line-height:1.7;}
.back{display:inline-block;margin-top:28px;color:var(--orange-dark);font-weight:700;font-size:.9rem;text-decoration:none;}
.back:hover{text-decoration:underline;}
</style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K27M7VKP" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <img src="/camp/camp_logo.png" alt="ホリエモンAI学校 1日Camp" class="logo">
  <main class="card">
    <div class="check">✓</div>
    <h1>お申込みありがとうございます！</h1>
    <p class="lead">1日Campへのお申込みが完了しました。<br>当日お会いできるのを楽しみにしています。</p>
    <div class="steps">
      <h2>このあとの流れ</h2>
      <ol>
        <li>ご登録のメールアドレスに「お申込み完了のご案内」をお送りしました。</li>
        <li>メールに記載のChatworkグループへご参加ください。当日の連絡や事前準備のご案内はこちらで行います。</li>
      </ol>
    </div>
    <p class="note">数分たってもメールが届かない場合は、迷惑メールフォルダをご確認ください。<br>それでも見当たらない場合は、お手数ですが info@horiemon.ai までご連絡ください。</p>
    <a href="/camp/" class="back">← 1日Campのページに戻る</a>
  </main>
</body>
</html>
